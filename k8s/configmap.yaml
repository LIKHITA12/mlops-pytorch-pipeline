apiVersion: v1
kind: ConfigMap
metadata:
  name: training-config
  namespace: mlops-pytorch
data:
  training_config.yaml: |
    model:
      input_dim: 10
      hidden_dim: 32
      num_classes: 2
    data:
      num_samples: 1000
      train_split: 0.8
      seed: 42
    training:
      epochs: 5
      batch_size: 32
      learning_rate: 0.001
      device: cpu
